name: CI

# Two independent checks on every push and PR:
#   - host-tests:  the fast, portable suite (launcher/test/run_tests.sh) -
#                   plain gcc, no ESP-IDF, seconds to run.
#   - build:        compiles for the real esp32c6 target via Espressif's own
#                   CI action, as a 2-entry matrix (release + the diagnostics
#                   variant that carries the test suites - see
#                   launcher/test/run_device_tests.sh, which builds the same
#                   two configs locally).
#
# What this can't cover: the on-device self-test run itself
# (test/run_device_tests.sh, tools/report_test_results.sh,
# tools/report_performance.sh) needs the real board over serial - see
# docs/Sand/Architecture.md's "Verifying performance on real hardware"
# section for that workflow. This is compile + host-test coverage only.

on:
  push:
  pull_request:

jobs:
  host-tests:
    name: Host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash launcher/test/run_tests.sh

  build:
    name: Build (${{ matrix.config }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: release
            command: idf.py build
          - config: diagnostics
            command: idf.py -B build.diag -D SDKCONFIG=build.diag/sdkconfig build
    steps:
      - uses: actions/checkout@v4
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: release-v5.5
          target: esp32c6
          path: launcher
          command: ${{ matrix.command }}

name: Host Tests

# The fast, portable suite (launcher/test/run_tests.sh) - plain gcc, no
# ESP-IDF, seconds to run. Split into its own workflow file (not a job
# alongside the build workflows) purely so it gets its own status badge -
# GitHub only exposes whole-workflow badges, never per-job ones.

on:
  push:
  pull_request:

jobs:
  host-tests:
    name: Host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash launcher/test/run_tests.sh
      - run: bash launcher/main/apps/sand/tools/report_reactions.sh --check

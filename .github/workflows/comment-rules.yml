name: Comment Rules

# The comment rules CLAUDE.md states, measured rather than argued: nothing
# beside code over 500 characters, no file header over 50 lines, and no comment
# naming a function that does not exist. The PostToolUse hook already refuses
# these on an edit's own new text, but a hook only binds an agent that has it
# configured - this is what holds the whole tree.
#
# Own workflow file, like the other four, purely so it gets its own badge -
# GitHub exposes whole-workflow badges and never per-job ones. See
# host-tests.yml's top comment.

on:
  push:
  pull_request:

jobs:
  comment-rules:
    name: Comment rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Length beside code, and header height
        run: >
          python3 scripts/check_comment_length.py
          --no-banners --limit 500 --header-limit 50 --top 0

      - name: Every function a comment names exists
        run: python3 scripts/check_comment_symbols.py

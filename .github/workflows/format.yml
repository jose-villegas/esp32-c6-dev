name: Format

# The formatting gate: every first-party C and header file, checked against
# .clang-format on every push and pull request. The tree was reformatted
# wholesale once (#193); this is what stops it drifting back one PR at a
# time. The pre-commit hook (scripts/install-git-hooks.sh) reports the same
# thing earlier, but cannot enforce it - it is opt-in, skippable with
# --no-verify, and absent from any commit CI or a merge makes.
#
# clang-format is pinned to one exact version, not a minimum. The versions
# disagree about this config on real files in this tree: against the
# committed baseline, 19 reformats nothing, 20 reformats
# suite_sand_scenes.c, and 21 also reformats material.c and gfx.c. A range
# would let the runner's toolchain decide what the tree looks like, which is
# the drift this job exists to catch. pip rather than apt because it carries
# the exact patch version on any runner image; 19 because it is also what
# ESP-IDF's esp-clang bundles, so contributors usually already have it.
#
# Own workflow file, like the other five, purely so it gets its own badge -
# GitHub exposes whole-workflow badges and never per-job ones. See
# host-tests.yml's top comment.

on:
  push:
  pull_request:

jobs:
  clang-format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same version scripts/check-format.sh pins. Keep the two in step:
      # PINNED_MAJOR there, this line here.
      - name: Install clang-format 19
        run: pip install 'clang-format==19.1.7'

      - name: Which clang-format, and which files
        run: |
          set -eu
          scripts/check-format.sh --which
          clang-format --version
          echo "Files checked: $(scripts/format-file-list.sh | wc -l)"

      # scripts/format-file-list.sh is the same list the hook filters against,
      # so a file cannot be gated here and skipped there. Vendored and
      # generated sources are excluded by it, not by this workflow.
      - name: Every first-party C and header file is formatted
        run: scripts/format-file-list.sh | xargs scripts/check-format.sh --check

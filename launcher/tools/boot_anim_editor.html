<!DOCTYPE html>
<!--
  Boot animation editor - a local, standalone preview/editor for the startup
  animation's timing and camera keyframes. No server, no build step: open
  this file directly in a browser.

  WHAT THIS IS

  A live JS reimplementation (float, not the firmware's fixed-point) of the
  math in launcher/main/boot/boot_anim.h and boot_anim.c, driven by the same
  data shape as launcher/main/boot/boot_anim_timeline.json - timing
  constants plus a list of camera keyframes (position, rotation, scale, each
  with an easing mode). Editing either live-updates the render view.

  WHAT "BAKE" DOES

  Downloads a JSON file in exactly boot_anim_timeline.json's shape. This
  tool never writes into the repo itself - it has no server to do that with.
  Replace launcher/main/boot/boot_anim_timeline.json with the download, then
  regenerate the firmware header:

      python tools/gen_boot_anim_timeline.py main/boot/boot_anim_timeline.json > main/boot/boot_anim_timeline.h

  "Load" reopens a previously-baked JSON (or any file in this shape) to keep
  editing it.

  WHAT DOES NOT MATCH THE DEVICE EXACTLY

  This is float arithmetic (JS has no reason to fight fixed-point the way an
  FPU-less RISC-V chip does) and the curve data below is the same table
  boot_anim_curve.h ships, converted once to floats - not recomputed here.
  Pixel-level fidelity is not the point; seeing the shape and timing of the
  animation before a five-second rebuild-reflash-eyeball loop is.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Boot Animation Editor</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0c10;
    --panel: #14161c;
    --panel-border: #2a2d37;
    --text: #e4e6eb;
    --text-dim: #8b8f9c;
    --accent: #5b9dff;
    --accent-dim: #2c3e5c;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.4 -apple-system, "Segoe UI", sans-serif;
  }
  #app {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: auto auto auto;
    gap: 10px;
    padding: 10px;
    max-width: 1400px;
    margin: 0 auto;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    padding: 10px;
    min-width: 0;
  }
  .panel h2 {
    margin: 0 0 8px;
    font-size: 11px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--text-dim);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #renderPanel canvas {
    width: 100%;
    height: auto;
    background: #000;
    border-radius: 4px;
    display: block;
  }
  #playbar {
    grid-column: 1 / 3;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #playbar input[type=range] { flex: 1; }
  button {
    background: var(--accent-dim);
    color: var(--text);
    border: 1px solid var(--panel-border);
    border-radius: 4px;
    padding: 6px 12px;
    font: inherit;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #fff; }
  button.danger { background: #3a2020; border-color: var(--danger); }
  button:disabled { opacity: .4; cursor: default; }
  input[type=number], input[type=text], select {
    background: #0d0e12;
    color: var(--text);
    border: 1px solid var(--panel-border);
    border-radius: 3px;
    padding: 3px 5px;
    font: inherit;
    width: 100%;
  }
  input:disabled, select:disabled { opacity: .35; }
  label.field {
    display: grid;
    grid-template-columns: 1fr 90px;
    gap: 6px;
    align-items: center;
    margin: 3px 0;
    font-size: 12px;
    color: var(--text-dim);
  }
  #constsPanel { max-height: 320px; overflow-y: auto; }
  #constsPanel .group-title {
    color: var(--accent);
    font-size: 11px;
    margin: 10px 0 2px;
    text-transform: uppercase;
    letter-spacing: .06em;
  }
  #constsPanel .group-title:first-child { margin-top: 0; }
  #kfTrack {
    position: relative;
    height: 46px;
    background: #0d0e12;
    border-radius: 4px;
    margin: 6px 0 10px;
    cursor: pointer;
  }
  #kfTrack .kf-dot {
    position: absolute;
    top: 50%;
    width: 14px; height: 14px;
    margin-left: -7px; margin-top: -7px;
    border-radius: 50%;
    background: var(--accent-dim);
    border: 2px solid var(--accent);
    cursor: grab;
  }
  #kfTrack .kf-dot.selected { background: var(--accent); }
  #kfTrack .playhead {
    position: absolute;
    top: 0; bottom: 0;
    width: 2px;
    background: var(--danger);
    pointer-events: none;
  }
  #kfButtons { display: flex; gap: 6px; margin-bottom: 4px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  .subhead { font-size: 11px; color: var(--text-dim); margin: 8px 0 2px; }
  #bakeInfo {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 6px;
    word-break: break-all;
  }
  #bakeInfo code {
    display: block;
    background: #0d0e12;
    padding: 6px;
    border-radius: 3px;
    margin-top: 4px;
    user-select: all;
  }
</style>
</head>
<body>
<div id="app">

  <div class="panel" id="renderPanel">
    <h2>Render view</h2>
    <canvas id="canvas" width="448" height="368"></canvas>
  </div>

  <div class="panel" id="kfPanel">
    <h2>Keyframes <span id="kfCount"></span></h2>
    <div id="kfTrack"></div>
    <div id="kfButtons">
      <button id="btnAddKf">+ Add at playhead</button>
      <button id="btnDelKf" class="danger">Delete selected</button>
    </div>
  </div>

  <div class="panel" id="constsPanel">
    <h2>Other consts</h2>
    <div id="constsList"></div>
  </div>

  <div class="panel" id="kfDetailPanel">
    <h2>Keyframe details</h2>
    <div id="kfDetail"></div>
  </div>

  <div class="panel" id="playbar">
    <button id="btnPlay">Play</button>
    <span id="msReadout" style="width:70px;text-align:right;color:var(--text-dim)">0 ms</span>
    <input type="range" id="scrub" min="0" max="5800" value="0" step="1">
    <button id="btnLoad">Load</button>
    <input type="file" id="fileInput" accept=".json" style="display:none">
    <button id="btnBake" class="primary">Bake</button>
  </div>

</div>

/* ===========================================================================
 * tween - the float equivalent of util/tween.h, in 0..1 fractions rather
 * than 0..255 bytes: nothing here is firmware-constrained to a byte, and a
 * float fraction is one fewer conversion at every call site.
 * ======================================================================= */

function ramp01(nowMs, startMs, durMs) {
  if (nowMs <= startMs) return 0;
  if (durMs <= 0) return 1;
  return Math.min(1, (nowMs - startMs) / durMs);
}
function easeOut01(u) { return 1 - (1 - u) * (1 - u); }
function easeIn01(u) { return u * u; }
function lerp(a, b, u) { return a + (b - a) * u; }
function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }

function mixColor(a, b, amt255) {
  const t = clamp(amt255, 0, 255) / 255;
  return { r: a.r + (b.r - a.r) * t, g: a.g + (b.g - a.g) * t, b: a.b + (b.b - a.b) * t };
}
function lit(rgb, alpha255) { return mixColor(COL_BLACK, rgb, alpha255); }
function litWhitened(rgb, whiten255, alpha255) {
  return mixColor(COL_BLACK, mixColor(rgb, COL_WHITE, whiten255), alpha255);
}
function scale8(a, b) { return (a * b) / 255; }
function toCss(c) {
  return `rgb(${clamp(c.r,0,255)|0},${clamp(c.g,0,255)|0},${clamp(c.b,0,255)|0})`;
}

/* Same six-sector ramp as boot_anim_hue_rgb(). */
function hueRgb(hue) {
  hue = ((hue % HUE_TURN) + HUE_TURN) % HUE_TURN;
  const ramp = hue & 0xFF, fall = 255 - ramp;
  switch (hue >> 8) {
    case 0: return { r: 0xFF, g: ramp, b: 0 };
    case 1: return { r: fall, g: 0xFF, b: 0 };
    case 2: return { r: 0, g: 0xFF, b: ramp };
    case 3: return { r: 0, g: fall, b: 0xFF };
    case 4: return { r: ramp, g: 0, b: 0xFF };
    default: return { r: 0xFF, g: 0, b: fall };
  }

/* ===========================================================================
 * The timeline - the float mirror of boot_anim_timeline_sample() in
 * boot_anim.h. `kfs` is state.keyframes, sorted by ms (the UI keeps it so).
 * ======================================================================= */

function timelineSample(nowMs, kfs) {
  const first = kfs[0], last = kfs[kfs.length - 1];
  if (nowMs <= first.ms || nowMs >= last.ms) {
    const k = nowMs <= first.ms ? first : last;
    return { ox: k.pos[0], oy: k.pos[1], rot: k.rot[0], scale: k.scale[0] };
  }
  let i = 1;
  while (kfs[i].ms < nowMs) i++;
  const a = kfs[i - 1], b = kfs[i];
  const u0 = ramp01(nowMs, a.ms, b.ms - a.ms);
  const u = b.ease === 'ease_out' ? easeOut01(u0) : b.ease === 'ease_in' ? easeIn01(u0) : u0;

    ox: lerp(a.pos[0], b.pos[0], u),

    rot: lerp(a.rot[0], b.rot[0], u),

  const ceiling = lerp(timing.grid_max, timing.grid_ceiling_max, gridClimb(nowMs, timing));
  const near = (left * ceiling) / GRID_FADE;
  return (arrived * near) / 255;
}

function gridWhiten(nowMs, timing) {
  return lerp(0, timing.grid_whiten_max, gridClimb(nowMs, timing));
}

function gridHue(nowMs, ring, timing) {
  const turn = (nowMs % timing.grid_hue_ms) * HUE_TURN / timing.grid_hue_ms;
  return turn + ring * timing.grid_hue_spread;
}

function gridShrinkFrac(nowMs, timing, kfs) {
  const motif = timelineSample(nowMs, kfs).scale / 256;
  const pulsed = GRID_SHRINK * motif;
  return Math.max(pulsed, GRID_SHRINK);
}

function penFraction(nowMs, timing) {
  const phase1Frac = (BOOT_CURVE_PHASE1 - 1) / (BOOT_CURVE.length - 1);
  const phase1EndMs = timing.pen_start_ms + timing.pen_ms;
  if (nowMs <= phase1EndMs) {
    const u = ramp01(nowMs, timing.pen_start_ms, timing.pen_ms);
    return phase1Frac * u;
  }
  const u2 = ramp01(nowMs, phase1EndMs, timing.fade_start_ms - phase1EndMs);
  return phase1Frac + (1 - phase1Frac) * u2;
}

function colourProgress(nowMs, timing) {
  const phase1Frac = (BOOT_CURVE_PHASE1 - 1) / (BOOT_CURVE.length - 1);
  return penFraction(nowMs, timing) / phase1Frac;
}

function inkAmount(nowMs, timing) {
  return 255 * (1 - ramp01(nowMs, timing.fade_start_ms, timing.total_ms - timing.fade_start_ms));
}

/* ===========================================================================
 * The projection
 * ======================================================================= */

function buildView(nowMs, timing, kfs) {
  const ts = timelineSample(nowMs, kfs);
  const rad = (ts.rot / 65536) * 2 * Math.PI;
  const c = Math.cos(rad), s = Math.sin(rad);
  return {
    ox: ts.ox, oy: ts.oy,
    reY: (D_RE_Y * c + B_RE_Y * s + C_RE_Y) / 256,
    imY: (D_IM_Y * c + B_IM_Y * s + C_IM_Y) / 256,
    tY: (D_T_Y * c + B_T_Y * s + C_T_Y) / 256,
  };
}
function sx(re, im, view) { return view.ox + re * REX + im * IMX; }
function sy(re, im, t, view) { return view.oy + re * view.reY + im * view.imY + t * view.tY; }
function csx(re, im, shrink, view) { const r = sx(re, im, view); return view.ox + (r - view.ox) * shrink; }
function csy(re, im, t, shrink, view) { const r = sy(re, im, t, view); return view.oy + (r - view.oy) * shrink; }

/* ===========================================================================
 * Drawing - canvas equivalents of gfx_line_ex()/gfx_fill_rect() etc. The
 * whole panel-space picture is drawn under a single rotate+translate (see
 * drawFrame()), so nothing here needs boot_anim.c's own DISPLAY_LANDSCAPE
 * glyph-rotation correction - the canvas transform already covers it.
 * ======================================================================= */

function line(ctx, x0, y0, x1, y1, color, width, additive) {
  ctx.globalCompositeOperation = additive ? 'lighter' : 'source-over';
  ctx.strokeStyle = toCss(color);
  ctx.lineWidth = width || 1;
  ctx.beginPath();
  ctx.moveTo(x0, y0);
  ctx.lineTo(x1, y1);
  ctx.stroke();
  ctx.globalCompositeOperation = 'source-over';
}
function disc(ctx, x, y, diameter, color) {
  ctx.fillStyle = toCss(color);
  ctx.beginPath();
  ctx.arc(x, y, diameter / 2, 0, Math.PI * 2);
  ctx.fill();
}
function square(ctx, x, y, size, color) {
  ctx.fillStyle = toCss(color);
  ctx.fillRect(x - size / 2, y - size / 2, size, size);
}

function drawFloor(ctx, nowMs, ink, view, shrink, timing) {
  const far = GRID_RINGS * GRID_STEP * shrink;
  for (let ring = 1; ring <= GRID_RINGS; ring++) {
    const alpha = scale8(gridAlpha(nowMs, ring, timing), ink);
    if (alpha <= 0) continue;
    const c = litWhitened(hueRgb(gridHue(nowMs, ring, timing)), gridWhiten(nowMs, timing), alpha);
    const d = ring * GRID_STEP * shrink;
    for (const sign of [-1, 1]) {
      const off = sign * d;
      line(ctx, sx(off, -far, view), sy(off, -far, 0, view), sx(off, far, view), sy(off, far, 0, view), c);
      line(ctx, sx(-far, off, view), sy(-far, off, 0, view), sx(far, off, view), sy(far, off, 0, view), c);
    }
  }
}

function drawArm(ctx, re, im, t, reach, ink, shrink, view) {
  const fre = re * reach, fim = im * reach, ft = t * reach;
  line(ctx, csx(0, 0, shrink, view), csy(0, 0, 0, shrink, view),
       csx(fre, fim, shrink, view), csy(fre, fim, ft, shrink, view), lit(COL_AXIS, ink));
}
function drawLabel(ctx, x, y, text, ink) {
  ctx.fillStyle = toCss(lit(COL_TICK, ink));
  ctx.font = '9px monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, x, y);
}

function drawAxes(ctx, nowMs, ink, view, shrink, timing) {
  const reach = axisReach(nowMs, timing);
  if (reach <= 0) return;
  const finale = finaleReach(nowMs, timing);
  const arm = lerp(4, AXIS_FAR_UNITS, finale);
  const top = lerp(T_MAX_PHASE1 + 1, T_MAX * 3, finale);

  drawArm(ctx, arm, 0, 0, reach, ink, shrink, view);
  drawArm(ctx, 0, arm, 0, reach, ink, shrink, view);
  drawArm(ctx, 0, 0, top, reach, ink, shrink, view);

  if (reach >= 0.999 && finale <= 0.001) {
    drawLabel(ctx, sx(arm, 0, view) + 10, sy(arm, 0, 0, view) + 5, 'Re', ink);
    drawLabel(ctx, sx(0, arm, view) - 10, sy(0, arm, 0, view) + 5, 'Im', ink);
    drawLabel(ctx, sx(0, 0, view) + 10, sy(0, 0, top, view) - 5, 't', ink);
  }
}

function sample(i) {
  if (i < 0) i = 0; else if (i >= BOOT_CURVE.length) i = BOOT_CURVE.length - 1;
  return BOOT_CURVE[i];
}
function spline(c0, c1, c2, t) {
  const u = 1 - t, w0 = u * u, w2 = t * t, w1 = 2 - w0 - w2;
  return [
    (w0 * c0[0] + w1 * c1[0] + w2 * c2[0]) / 2,
    (w0 * c0[1] + w1 * c1[1] + w2 * c2[1]) / 2,
    (w0 * c0[2] + w1 * c1[2] + w2 * c2[2]) / 2,
  ];
}

function trailPos(colourFrac, k) { return colourFrac - k * TRAIL_GAP_FRAC; }
function trailHue(k) { return k * (HUE_TURN / TRAILS); }

function strokeInfo(alongFrac, colourFrac) {
  const baseAlong = Math.min(alongFrac, 1);
  const baseGlow = 132 + baseAlong * 60;
  const baseBloom = baseAlong * 24;
  const baseHue = HUE_START + alongFrac * HUE_SWEEP;

  let best = 0, bestHue = 0;
  for (let k = 0; k < TRAILS; k++) {
    const behind = trailPos(colourFrac, k) - alongFrac;
    if (behind < 0 || behind >= TRAIL_SPAN_FRAC) continue;
    const trail = 255 * (1 - behind / TRAIL_SPAN_FRAC);
    if (trail > best) { best = trail; bestHue = trailHue(k); }
  }
  const mixT = best / 255;
  return {
    hue: baseHue + bestHue * mixT,
    glow: baseGlow + (255 - baseGlow) * mixT,
    bloom: baseBloom + (90 - baseBloom) * mixT,
    width: best >= FAT_TRAIL ? FAT_WIDTH : 1,
  };
}

function drawHead(ctx, x, y, rgb, ink) {
  disc(ctx, x, y, HEAD_OUTER, lit(rgb, scale8(70, ink)));
  disc(ctx, x, y, HEAD_MID, lit(rgb, scale8(215, ink)));
  disc(ctx, x, y, HEAD_CORE, mixColor(COL_BLACK, COL_WHITE, ink));
}

function drawHeads(ctx, colourFrac, ink, shrink, view, phase1Span) {
  for (let k = 0; k < TRAILS; k++) {
    const at = trailPos(colourFrac, k);
    if (at <= 0) continue;
    let i = Math.floor(at * phase1Span);
    if (i >= BOOT_CURVE.length) i = BOOT_CURVE.length - 1;
    const p = sample(i);
    const info = strokeInfo(at, colourFrac);
    drawHead(ctx, csx(p[0], p[1], shrink, view), csy(p[0], p[1], p[2], shrink, view), hueRgb(info.hue), ink);
  }
}

function drawCurve(ctx, nowMs, ink, view, shrink, timing) {
  const penFrac = penFraction(nowMs, timing);
  if (penFrac <= 0) return 0;

  const span = BOOT_CURVE.length - 1;
  const at = penFrac * span;
  const lastIdx = Math.floor(at);
  const part = at - lastIdx;
  const colour = colourProgress(nowMs, timing);
  const phase1Span = BOOT_CURVE_PHASE1 - 1;

  let head = BOOT_CURVE[0];
  let px = csx(head[0], head[1], shrink, view), py = csy(head[0], head[1], head[2], shrink, view);

  for (let i = 0; i <= lastIdx && i < BOOT_CURVE.length; i++) {
    const c0 = sample(i - 1), c1 = sample(i), c2 = sample(i + 1);
    const a0 = i / phase1Span, a1 = (i + 1) / phase1Span;
    const limit = i === lastIdx ? part : 1;

    for (let step = 1; step <= SPLINE_STEPS; step++) {
      const t = (limit * step) / SPLINE_STEPS;
      head = spline(c0, c1, c2, t);
      const nx = csx(head[0], head[1], shrink, view), ny = csy(head[0], head[1], head[2], shrink, view);
      const along = a0 + (a1 - a0) * t;
      const info = strokeInfo(along, colour);
      let c = mixColor(hueRgb(info.hue), COL_WHITE, info.bloom);
      c = mixColor(COL_BLACK, c, scale8(info.glow, ink));
      line(ctx, px, py, nx, ny, c, info.width, true);
      px = nx; py = ny;
    }
  }
  drawHeads(ctx, colour, ink, shrink, view, phase1Span);
  return head[2];
}

function drawZeros(ctx, reachedT, ink, shrink, view) {
  for (const t of BOOT_ZEROS) {
    if (t > reachedT) break;
    square(ctx, csx(0, 0, shrink, view), csy(0, 0, t, shrink, view), ZERO_DOT, lit(COL_ZERO, ink));
  }
}

/* ===========================================================================
 * The title - drawn straight into the VIEWER frame (this canvas already is
 * one), so none of boot_anim.c's panel<->viewer translation is needed.
 * ======================================================================= */

function titleWobble(dFrac, timing) {
  if (dFrac <= 0) return 0;
  const d2 = dFrac * dFrac;
  const phase = d2 * timing.title_turns_phase;
  const amp = timing.title_amplitude_px * dFrac;
  return amp * Math.sin((phase / 65536) * 2 * Math.PI);
}
function titleWave(i, nowMs, timing) {
  const t = (nowMs + i * timing.title_wave_stagger_ms) % timing.title_wave_period_ms;
  return timing.title_wave_amplitude_px * Math.sin((t / timing.title_wave_period_ms) * 2 * Math.PI);
}
function titleLetter(i, nowMs, timing) {
  const start = timing.title_start_ms + i * timing.title_stagger_ms;
  const u = easeOut01(ramp01(nowMs, start, timing.title_flight_ms));
  const cell = 8 * TITLE_SCALE + TITLE_GAP;
  const finalX = TITLE_VIEW_X + i * cell;
  const startX = finalX - timing.title_entry_px;
  const x = lerp(startX, finalX, u);
  const d = 1 - u;
  const y = TITLE_VIEW_Y + titleWobble(d, timing) + titleWave(i, nowMs, timing);
  return { x, y };
}
function drawTitle(ctx, nowMs, ink, timing) {
  const c = mixColor(COL_BLACK, COL_WHITE, ink);
  ctx.fillStyle = toCss(c);
  ctx.font = `${TITLE_SCALE * 8}px monospace`;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  for (let i = 0; i < TITLE_LEN; i++) {
    const p = titleLetter(i, nowMs, timing);
    ctx.fillText(TITLE[i], p.x, p.y);
  }
}

/* ===========================================================================
 * The frame
 * ======================================================================= */

function drawFrame(ctx, nowMs, state) {
  const timing = state.timing, kfs = state.keyframes;
  const ink = inkAmount(nowMs, timing);
  const view = buildView(nowMs, timing, kfs);
  const shrink = timelineSample(nowMs, kfs).scale / 256;
  const gridShrink = gridShrinkFrac(nowMs, timing, kfs);

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);

  ctx.save();
  ctx.translate(0, PANEL_W);
  ctx.rotate(-Math.PI / 2);
  drawFloor(ctx, nowMs, ink, view, gridShrink, timing);
  drawAxes(ctx, nowMs, ink, view, shrink, timing);
  const reachedT = drawCurve(ctx, nowMs, ink, view, shrink, timing);
  drawZeros(ctx, reachedT, ink, shrink, view);
  ctx.restore();

  if (nowMs >= timing.title_start_ms) drawTitle(ctx, nowMs, ink, timing);
}

/* ===========================================================================
 * State, UI wiring, playback, bake/load
 * ======================================================================= */

const DEFAULT_STATE = {
  timing: {
    total_ms: 5800, axes_ms: 450, grid_start_ms: 150, grid_ring_ms: 12,
    grid_fade_ms: 300, pen_start_ms: 520, pen_ms: 1980, title_start_ms: 2700,
    title_stagger_ms: 140, title_flight_ms: 900, title_entry_px: 320,
    title_turns_phase: 229376, title_amplitude_px: 22,
    title_wave_amplitude_px: 11, title_wave_period_ms: 1600,
    title_wave_stagger_ms: 90, fade_start_ms: 4300, grid_hue_ms: 2600,
    grid_hue_spread: 70, grid_whiten_max: 120, grid_ceiling_max: 170,
    grid_max: 70,
  },
  keyframes: [
    { ms: 520, pos: [184, 336], rot: [0, 0, 0], scale: [256, 256, 256], ease: 'linear' },
    { ms: 2500, pos: [184, 112], rot: [10559, 0, 0], scale: [256, 256, 256], ease: 'linear' },
    { ms: 2700, pos: [184, 112], rot: [10559, 0, 0], scale: [256, 256, 256], ease: 'linear' },
    { ms: 3600, pos: [184, 112], rot: [10559, 0, 0], scale: [380, 380, 380], ease: 'ease_out' },
    { ms: 4200, pos: [184, 112], rot: [10559, 0, 0], scale: [28, 28, 28], ease: 'ease_in' },
    { ms: 4300, pos: [184, 112], rot: [10559, 0, 0], scale: [28, 28, 28], ease: 'linear' },
    { ms: 5800, pos: [151, 138], rot: [20936, 0, 0], scale: [28, 28, 28], ease: 'ease_out' },
  ],
};

const TIMING_GROUPS = [
  { title: 'Overall', keys: ['total_ms', 'fade_start_ms'] },
  { title: 'Axes / grid', keys: ['axes_ms', 'grid_start_ms', 'grid_ring_ms', 'grid_fade_ms',
      'grid_hue_ms', 'grid_hue_spread', 'grid_whiten_max', 'grid_ceiling_max', 'grid_max'] },
  { title: 'Curve', keys: ['pen_start_ms', 'pen_ms'] },
  { title: 'Title', keys: ['title_start_ms', 'title_stagger_ms', 'title_flight_ms',
      'title_entry_px', 'title_turns_phase', 'title_amplitude_px',
      'title_wave_amplitude_px', 'title_wave_period_ms', 'title_wave_stagger_ms'] },
];

let state = JSON.parse(JSON.stringify(DEFAULT_STATE));
let playhead = 0;
let playing = false;
let selectedKf = 0;
let lastFrameTime = 0;

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const scrub = document.getElementById('scrub');
const msReadout = document.getElementById('msReadout');
const btnPlay = document.getElementById('btnPlay');

function sortKeyframes() {
  const selected = state.keyframes[selectedKf];
  state.keyframes.sort((a, b) => a.ms - b.ms);
  selectedKf = state.keyframes.indexOf(selected);
}

function render() {
  drawFrame(ctx, playhead, state);
  scrub.max = state.timing.total_ms;
  scrub.value = playhead;
  msReadout.textContent = `${Math.round(playhead)} ms`;
  renderKfTrack();
}

function renderConsts() {
  const list = document.getElementById('constsList');
  list.innerHTML = '';
  for (const group of TIMING_GROUPS) {
    const h = document.createElement('div');
    h.className = 'group-title';
    h.textContent = group.title;
    list.appendChild(h);
    for (const key of group.keys) {
      const label = document.createElement('label');
      label.className = 'field';
      const span = document.createElement('span');
      span.textContent = key;
      const input = document.createElement('input');
      input.type = 'number';
      input.value = state.timing[key];
      input.addEventListener('input', () => {
        state.timing[key] = Number(input.value) || 0;
        render();
      });
      label.appendChild(span);
      label.appendChild(input);
      list.appendChild(label);
    }
  }
}

function renderKfTrack() {
  const track = document.getElementById('kfTrack');
  track.innerHTML = '';
  document.getElementById('kfCount').textContent = `(${state.keyframes.length})`;
  const totalMs = state.timing.total_ms || 1;

  state.keyframes.forEach((kf, i) => {
    const dot = document.createElement('div');
    dot.className = 'kf-dot' + (i === selectedKf ? ' selected' : '');
    dot.style.left = `${(kf.ms / totalMs) * 100}%`;
    dot.title = `ms ${kf.ms}`;
    dot.addEventListener('mousedown', (e) => {
      e.stopPropagation();
      selectedKf = i;
      renderKfTrack();
      renderKfDetail();
      const trackRect = track.getBoundingClientRect();
      const onMove = (ev) => {
        const frac = clamp((ev.clientX - trackRect.left) / trackRect.width, 0, 1);
        kf.ms = Math.round(frac * totalMs);
        sortKeyframes();
        renderKfTrack();
        renderKfDetail();
        playhead = kf.ms;
        render();
      };
      const onUp = () => {
        window.removeEventListener('mousemove', onMove);
        window.removeEventListener('mouseup', onUp);
      };
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onUp);
    });
    track.appendChild(dot);
  });

  const ph = document.createElement('div');
  ph.className = 'playhead';
  ph.style.left = `${(playhead / totalMs) * 100}%`;
  track.appendChild(ph);
}

document.getElementById('kfTrack').addEventListener('click', (e) => {
  const rect = e.currentTarget.getBoundingClientRect();
  const frac = clamp((e.clientX - rect.left) / rect.width, 0, 1);
  playhead = frac * state.timing.total_ms;
  playing = false;
  btnPlay.textContent = 'Play';
  render();
});

function renderKfDetail() {
  const kf = state.keyframes[selectedKf];
  const el = document.getElementById('kfDetail');
  el.innerHTML = '';
  if (!kf) return;

  const addField = (label, value, onChange, disabled) => {
    const row = document.createElement('label');
    row.className = 'field';
    const span = document.createElement('span');
    span.textContent = label;
    const input = document.createElement('input');
    input.type = 'number';
    input.value = value;
    input.disabled = !!disabled;
    input.addEventListener('input', () => onChange(Number(input.value) || 0));
    row.appendChild(span);
    row.appendChild(input);
    el.appendChild(row);
  };

  addField('ms', kf.ms, (v) => { kf.ms = v; sortKeyframes(); playhead = kf.ms; renderKfTrack(); render(); });

  const sub1 = document.createElement('div');
  sub1.className = 'subhead';
  sub1.textContent = 'pos (panel px)';
  el.appendChild(sub1);
  const posRow = document.createElement('div');
  posRow.className = 'row3';
  ['x', 'y'].forEach((axis, i) => {
    const input = document.createElement('input');
    input.type = 'number';
    input.value = kf.pos[i];
    input.addEventListener('input', () => { kf.pos[i] = Number(input.value) || 0; render(); });
    posRow.appendChild(input);
  });
  el.appendChild(posRow);

  const sub2 = document.createElement('div');
  sub2.className = 'subhead';
  sub2.textContent = 'rot (x = camera pitch phase, 0..65536; y/z unused by this animation)';
  el.appendChild(sub2);
  const rotRow = document.createElement('div');
  rotRow.className = 'row3';
  ['x', 'y', 'z'].forEach((axis, i) => {
    const input = document.createElement('input');
    input.type = 'number';
    input.value = kf.rot[i];
    input.disabled = i > 0;
    input.addEventListener('input', () => { kf.rot[i] = Number(input.value) || 0; render(); });
    rotRow.appendChild(input);
  });
  el.appendChild(rotRow);

  const sub3 = document.createElement('div');
  sub3.className = 'subhead';
  sub3.textContent = 'scale (uniform - x/y/z locked together, 256 = 1.0)';
  el.appendChild(sub3);
  const scaleInput = document.createElement('input');
  scaleInput.type = 'number';
  scaleInput.value = kf.scale[0];
  scaleInput.addEventListener('input', () => {
    const v = Number(scaleInput.value) || 0;
    kf.scale[0] = kf.scale[1] = kf.scale[2] = v;
    render();
  });
  el.appendChild(scaleInput);

  const sub4 = document.createElement('div');
  sub4.className = 'subhead';
  sub4.textContent = 'ease (of the segment arriving at this keyframe)';
  el.appendChild(sub4);
  const easeSelect = document.createElement('select');
  const isFirst = selectedKf === 0;
  easeSelect.disabled = isFirst;
  for (const opt of ['linear', 'ease_out', 'ease_in']) {
    const o = document.createElement('option');
    o.value = opt;
    o.textContent = opt;
    if (kf.ease === opt) o.selected = true;
    easeSelect.appendChild(o);
  }
  easeSelect.addEventListener('change', () => { kf.ease = easeSelect.value; render(); });
  el.appendChild(easeSelect);

  document.getElementById('btnDelKf').disabled = state.keyframes.length <= 2;
}

document.getElementById('btnAddKf').addEventListener('click', () => {
  const ts = timelineSample(playhead, state.keyframes);
  state.keyframes.push({
    ms: Math.round(playhead),
    pos: [Math.round(ts.ox), Math.round(ts.oy)],
    rot: [Math.round(ts.rot), 0, 0],
    scale: [Math.round(ts.scale), Math.round(ts.scale), Math.round(ts.scale)],
    ease: 'linear',
  });
  sortKeyframes();
  selectedKf = state.keyframes.findIndex((k) => k.ms === Math.round(playhead));
  renderKfTrack();
  renderKfDetail();
  render();
});

document.getElementById('btnDelKf').addEventListener('click', () => {
  if (state.keyframes.length <= 2) return;
  state.keyframes.splice(selectedKf, 1);
  selectedKf = clamp(selectedKf, 0, state.keyframes.length - 1);
  renderKfTrack();
  renderKfDetail();
  render();
});

scrub.addEventListener('input', () => {
  playing = false;
  btnPlay.textContent = 'Play';
  playhead = Number(scrub.value);
  render();
});

btnPlay.addEventListener('click', () => {
  playing = !playing;
  btnPlay.textContent = playing ? 'Pause' : 'Play';
  if (playing) {
    if (playhead >= state.timing.total_ms) playhead = 0;
    lastFrameTime = performance.now();
    requestAnimationFrame(tick);
  }
});

function tick(now) {
  if (!playing) return;
  const dt = now - lastFrameTime;
  lastFrameTime = now;
  playhead += dt;
  if (playhead >= state.timing.total_ms) {
    playhead = 0;
  }
  render();
  requestAnimationFrame(tick);
}

document.getElementById('btnBake').addEventListener('click', () => {
  const payload = { timing: state.timing, keyframes: state.keyframes };
  const blob = new Blob([JSON.stringify(payload, null, 4)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'boot_anim_timeline.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
});

document.getElementById('btnLoad').addEventListener('click', () => {
  document.getElementById('fileInput').click();
});
document.getElementById('fileInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const loaded = JSON.parse(reader.result);
      if (!loaded.timing || !loaded.keyframes) throw new Error('missing timing/keyframes');
      state = loaded;
      selectedKf = 0;
      playhead = 0;
      renderConsts();
      renderKfTrack();
      renderKfDetail();
      render();
    } catch (err) {
      alert('Could not load that file as a boot_anim_timeline.json: ' + err.message);
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

renderConsts();
renderKfTrack();
renderKfDetail();
render();
</script>
</body>
</html>

<!DOCTYPE html>
<!--
  Boot animation editor - a live editor for the startup animation's timing
  and camera keyframes, rendered with the REAL firmware code.

  RUN IT

      python tools/boot_anim_editor_server.py

  then open http://127.0.0.1:8934/ - this page is served BY that script, it
  is not meant to be opened directly as a file:// page any more (phase 1 of
  this tool was; see boot_anim_editor_server.py's own top comment for why a
  server is what makes actual C-code rendering possible without a WASM
  toolchain).

  WHAT THE RENDER VIEW SHOWS

  Not a JS reimplementation of boot_anim.h/boot_anim.c's math. Every image
  in the render view is produced by compiling and running the REAL firmware
  drawing code (main/gfx/gfx.c + main/boot/boot_anim.c, unmodified - see
  their own ESP_PLATFORM comments) against whatever timing/keyframes are
  currently in this page, on the machine running the server. See
  boot_anim_editor_server.py for exactly how.

  WHAT "BAKE" DOES

  Downloads a JSON file in boot_anim_timeline.json's shape. This page never
  writes into the repo itself. Replace launcher/main/boot/
  boot_anim_timeline.json with the download, then regenerate the firmware
  header:

      python tools/gen_boot_anim_timeline.py main/boot/boot_anim_timeline.json > main/boot/boot_anim_timeline.h

  "Load" reopens a previously-baked JSON (or any file in this shape) to
  keep editing it. Bake/Load never touch the SCRATCH copy the server
  renders from while you edit - that scratch copy is disposable by design.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Boot Animation Editor</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0c10;
    --panel: #14161c;
    --panel-border: #2a2d37;
    --text: #e4e6eb;
    --text-dim: #8b8f9c;
    --accent: #5b9dff;
    --accent-dim: #2c3e5c;
    --danger: #ff6b6b;
    --row-hover: #1c1f28;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.4 -apple-system, "Segoe UI", sans-serif;
  }
  #app {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: auto auto auto;
    gap: 10px;
    padding: 10px;
    max-width: 1400px;
    margin: 0 auto;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    padding: 10px;
    min-width: 0;
  }
  .panel h2 {
    margin: 0 0 8px;
    font-size: 11px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--text-dim);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #renderPanel { position: relative; }
  #renderFrame {
    position: relative;
    width: 100%;
    aspect-ratio: 448 / 368;
    background: #000;
    border-radius: 4px;
    overflow: hidden;
  }
  /* The rendered BMP is the panel's own native 368x448 PORTRAIT
   * framebuffer - same as the real device. Rotated 90deg here purely for
   * display, the way holding the device sideways does physically; nothing
   * about the render itself is rotated. */
  /* Box sized to the SOURCE bitmap's own portrait dimensions (368x448 -
   * the real panel's raw framebuffer), not the landscape footprint it
   * ends up with after rotating - sizing the box to the rotated
   * footprint instead would stretch the image to fit it before the
   * rotation ever applied. */
  #renderImg {
    position: absolute;
    width: 368px; height: 448px;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) rotate(90deg);
    transform-origin: center;
    image-rendering: pixelated;
  }
  #renderStatus {
    position: absolute;
    top: 6px; left: 6px;
    font-size: 11px;
    padding: 3px 7px;
    border-radius: 3px;
    background: rgba(0,0,0,.6);
    color: var(--text-dim);
  }
  #renderStatus.busy { color: var(--accent); }
  #renderStatus.error { color: var(--danger); background: rgba(60,10,10,.85); }
  #renderError {
    grid-column: 1 / 3;
    display: none;
    white-space: pre-wrap;
    font: 12px/1.4 ui-monospace, monospace;
    color: var(--danger);
    background: #1c1013;
    border: 1px solid var(--danger);
    border-radius: 6px;
    padding: 10px;
    max-height: 200px;
    overflow-y: auto;
  }
  #playbar {
    grid-column: 1 / 3;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #playbar input[type=range] { flex: 1; }
  button {
    background: var(--accent-dim);
    color: var(--text);
    border: 1px solid var(--panel-border);
    border-radius: 4px;
    padding: 6px 12px;
    font: inherit;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #fff; }
  button.danger { background: #3a2020; border-color: var(--danger); }
  button:disabled { opacity: .4; cursor: default; }
  input[type=number], input[type=text], select {
    background: #0d0e12;
    color: var(--text);
    border: 1px solid var(--panel-border);
    border-radius: 3px;
    padding: 3px 5px;
    font: inherit;
    width: 100%;
  }
  input:disabled, select:disabled { opacity: .35; }
  label.field {
    display: grid;
    grid-template-columns: 1fr 90px;
    gap: 6px;
    align-items: center;
    margin: 3px 0;
    font-size: 12px;
    color: var(--text-dim);
  }
  #constsPanel { max-height: 320px; overflow-y: auto; }
  #constsPanel .group-title {
    color: var(--accent);
    font-size: 11px;
    margin: 10px 0 2px;
    text-transform: uppercase;
    letter-spacing: .06em;
  }
  #constsPanel .group-title:first-child { margin-top: 0; }

  /* The slim strip: a visual/drag reference for WHERE keyframes sit on the
   * timeline, not the primary way to select or inspect one - see the list
   * just below it for that. */
  #kfTrack {
    position: relative;
    height: 28px;
    background: #0d0e12;
    border-radius: 4px;
    margin: 6px 0 8px;
    cursor: pointer;
  }
  #kfTrack .kf-dot {
    position: absolute;
    top: 50%;
    width: 10px; height: 10px;
    margin-left: -5px; margin-top: -5px;
    border-radius: 50%;
    background: var(--accent-dim);
    border: 2px solid var(--accent);
    cursor: grab;
  }
  #kfTrack .kf-dot.selected { background: var(--accent); }
  #kfTrack .playhead {
    position: absolute;
    top: 0; bottom: 0;
    width: 2px;
    background: var(--danger);
    pointer-events: none;
  }

  /* The list: the actual, clickable interface for keyframes. */
  #kfList {
    max-height: 190px;
    overflow-y: auto;
    border: 1px solid var(--panel-border);
    border-radius: 4px;
  }
  .kf-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 9px;
    border-bottom: 1px solid var(--panel-border);
    cursor: pointer;
  }
  .kf-row:last-child { border-bottom: none; }
  .kf-row:hover { background: var(--row-hover); }
  .kf-row.selected { background: var(--accent-dim); }
  .kf-row .kf-index {
    color: var(--text-dim);
    font-size: 11px;
    width: 1.4em;
  }
  .kf-row .kf-ms { font-variant-numeric: tabular-nums; width: 4.5em; }
  .kf-row .kf-summary {
    flex: 1;
    color: var(--text-dim);
    font-size: 11.5px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .kf-row .kf-del {
    background: none;
    border: none;
    color: var(--text-dim);
    padding: 2px 6px;
  }
  .kf-row .kf-del:hover { color: var(--danger); border-color: transparent; }

  #kfButtons { display: flex; gap: 6px; margin-top: 8px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  .subhead { font-size: 11px; color: var(--text-dim); margin: 8px 0 2px; }
</style>
</head>
<body>
<div id="app">

  <div class="panel" id="renderPanel">
    <h2>Render view</h2>
    <div id="renderFrame">
      <img id="renderImg" alt="">
      <div id="renderStatus"></div>
    </div>
  </div>

  <div class="panel" id="kfPanel">
    <h2>Keyframes <span id="kfCount"></span></h2>
    <div id="kfTrack"></div>
    <div id="kfList"></div>
    <div id="kfButtons">
      <button id="btnAddKf">+ Add at playhead</button>
    </div>
  </div>

  <div class="panel" id="constsPanel">
    <h2>Other consts</h2>
    <div id="constsList"></div>
  </div>

  <div class="panel" id="kfDetailPanel">
    <h2>Keyframe details</h2>
    <div id="kfDetail"></div>
  </div>

  <div id="renderError"></div>

  <div class="panel" id="playbar">
    <button id="btnPlay">Play</button>
    <span id="msReadout" style="width:70px;text-align:right;color:var(--text-dim)">0 ms</span>
    <input type="range" id="scrub" min="0" max="5800" value="0" step="1">
    <button id="btnLoad">Load</button>
    <input type="file" id="fileInput" accept=".json" style="display:none">
    <button id="btnBake" class="primary">Bake</button>
  </div>

</div>

<script>
'use strict';

/* ===========================================================================
 * State
 * ======================================================================= */

const DEFAULT_STATE = {
  timing: {
    total_ms: 5800, axes_ms: 450, grid_start_ms: 150, grid_ring_ms: 12,
    grid_fade_ms: 300, pen_start_ms: 520, pen_ms: 1980, title_start_ms: 2700,
    title_stagger_ms: 140, title_flight_ms: 900, title_entry_px: 320,
    title_turns_phase: 229376, title_amplitude_px: 22,
    title_wave_amplitude_px: 11, title_wave_period_ms: 1600,
    title_wave_stagger_ms: 90, fade_start_ms: 4300, grid_hue_ms: 2600,
    grid_hue_spread: 70, grid_whiten_max: 120, grid_ceiling_max: 170,
    grid_max: 70,
  },
  keyframes: [
    { ms: 520, pos: [184, 336], rot: [0, 0, 0], scale: [256, 256, 256], ease: 'linear' },
    { ms: 2500, pos: [184, 112], rot: [10559, 0, 0], scale: [256, 256, 256], ease: 'linear' },
    { ms: 2700, pos: [184, 112], rot: [10559, 0, 0], scale: [256, 256, 256], ease: 'linear' },
    { ms: 3600, pos: [184, 112], rot: [10559, 0, 0], scale: [380, 380, 380], ease: 'ease_out' },
    { ms: 4200, pos: [184, 112], rot: [10559, 0, 0], scale: [28, 28, 28], ease: 'ease_in' },
    { ms: 4300, pos: [184, 112], rot: [10559, 0, 0], scale: [28, 28, 28], ease: 'linear' },
    { ms: 5800, pos: [151, 138], rot: [20936, 0, 0], scale: [28, 28, 28], ease: 'ease_out' },
  ],
};

const TIMING_GROUPS = [
  { title: 'Overall', keys: ['total_ms', 'fade_start_ms'] },
  { title: 'Axes / grid', keys: ['axes_ms', 'grid_start_ms', 'grid_ring_ms', 'grid_fade_ms',
      'grid_hue_ms', 'grid_hue_spread', 'grid_whiten_max', 'grid_ceiling_max', 'grid_max'] },
  { title: 'Curve', keys: ['pen_start_ms', 'pen_ms'] },
  { title: 'Title', keys: ['title_start_ms', 'title_stagger_ms', 'title_flight_ms',
      'title_entry_px', 'title_turns_phase', 'title_amplitude_px',
      'title_wave_amplitude_px', 'title_wave_period_ms', 'title_wave_stagger_ms'] },
];

let state = JSON.parse(JSON.stringify(DEFAULT_STATE));
let playhead = 0;
let playing = false;
let selectedKf = 0;
let lastFrameTime = 0;

function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }

function sortKeyframes() {
  const selected = state.keyframes[selectedKf];
  state.keyframes.sort((a, b) => a.ms - b.ms);
  selectedKf = state.keyframes.indexOf(selected);
}

/* ===========================================================================
 * Rendering - fetches an actual frame from boot_anim_editor_server.py.
 * Debounced: edits to timing/keyframes (which force a server-side
 * recompile) wait a moment for more edits to land first; scrubbing/
 * playback calls this directly every frame instead, since ms alone never
 * triggers a recompile server-side.
 * ======================================================================= */

const statusEl = document.getElementById('renderStatus');
const errorEl = document.getElementById('renderError');
const imgEl = document.getElementById('renderImg');
const scrub = document.getElementById('scrub');
const msReadout = document.getElementById('msReadout');

let renderDebounceTimer = null;
let renderSeq = 0;
let lastObjectUrl = null;

async function renderNow() {
  const seq = ++renderSeq;
  statusEl.textContent = 'rendering...';
  statusEl.className = 'busy';

  let res;
  try {
    res = await fetch('/render', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ timing: state.timing, keyframes: state.keyframes, ms: playhead }),
    });
  } catch (err) {
    if (seq !== renderSeq) return;
    statusEl.textContent = 'server unreachable';
    statusEl.className = 'error';
    showError('Could not reach boot_anim_editor_server.py - is it still running?\n' + err);
    return;
  }
  if (seq !== renderSeq) return;

  if (!res.ok) {
    const body = await res.json().catch(() => ({ error: res.statusText }));
    statusEl.textContent = res.status >= 500 ? 'compile error' : 'invalid timeline';
    statusEl.className = 'error';
    showError(body.error || ('HTTP ' + res.status));
    return;
  }

  hideError();
  const blob = await res.blob();
  const url = URL.createObjectURL(blob);
  const prev = lastObjectUrl;
  imgEl.src = url;
  lastObjectUrl = url;
  if (prev) URL.revokeObjectURL(prev);
  statusEl.textContent = '';
  statusEl.className = '';
}

function showError(msg) {
  errorEl.textContent = msg;
  errorEl.style.display = 'block';
}
function hideError() {
  errorEl.style.display = 'none';
}

/* For scrub/play: immediate, no debounce - the server itself skips the
 * recompile when only `ms` changed. */
function renderFrame() {
  scrub.max = state.timing.total_ms;
  scrub.value = playhead;
  msReadout.textContent = `${Math.round(playhead)} ms`;
  renderKfTrack();
  renderNow();
}

/* For edits to timing/keyframes: debounced, since these force a server
 * recompile and typing/dragging fires many events in a row. */
function renderDebounced() {
  scrub.max = state.timing.total_ms;
  renderKfTrack();
  if (renderDebounceTimer) clearTimeout(renderDebounceTimer);
  renderDebounceTimer = setTimeout(renderNow, 250);
}

/* ===========================================================================
 * Other consts panel
 * ======================================================================= */

function renderConsts() {
  const list = document.getElementById('constsList');
  list.innerHTML = '';
  for (const group of TIMING_GROUPS) {
    const h = document.createElement('div');
    h.className = 'group-title';
    h.textContent = group.title;
    list.appendChild(h);
    for (const key of group.keys) {
      const label = document.createElement('label');
      label.className = 'field';
      const span = document.createElement('span');
      span.textContent = key;
      const input = document.createElement('input');
      input.type = 'number';
      input.value = state.timing[key];
      input.addEventListener('input', () => {
        state.timing[key] = Number(input.value) || 0;
        renderDebounced();
      });
      label.appendChild(span);
      label.appendChild(input);
      list.appendChild(label);
    }
  }
}

/* ===========================================================================
 * Keyframes: the slim drag strip + the clickable list
 * ======================================================================= */

function kfSummary(kf) {
  return `pos ${kf.pos[0]},${kf.pos[1]}  rot ${kf.rot[0]}  scale ${kf.scale[0]}  ${kf.ease}`;
}

function selectKf(i) {
  selectedKf = i;
  renderKfTrack();
  renderKfList();
  renderKfDetail();
}

function renderKfTrack() {
  const track = document.getElementById('kfTrack');
  track.innerHTML = '';
  document.getElementById('kfCount').textContent = `(${state.keyframes.length})`;
  const totalMs = state.timing.total_ms || 1;

  state.keyframes.forEach((kf, i) => {
    const dot = document.createElement('div');
    dot.className = 'kf-dot' + (i === selectedKf ? ' selected' : '');
    dot.style.left = `${(kf.ms / totalMs) * 100}%`;
    dot.title = `ms ${kf.ms}`;
    dot.addEventListener('mousedown', (e) => {
      e.stopPropagation();
      selectKf(i);
      const trackRect = track.getBoundingClientRect();
      const onMove = (ev) => {
        const frac = clamp((ev.clientX - trackRect.left) / trackRect.width, 0, 1);
        kf.ms = Math.round(frac * totalMs);
        sortKeyframes();
        renderKfTrack();
        renderKfList();
        renderKfDetail();
        playhead = kf.ms;
        renderFrame();
      };
      const onUp = () => {
        window.removeEventListener('mousemove', onMove);
        window.removeEventListener('mouseup', onUp);
      };
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onUp);
    });
    track.appendChild(dot);
  });

  const ph = document.createElement('div');
  ph.className = 'playhead';
  ph.style.left = `${(playhead / totalMs) * 100}%`;
  track.appendChild(ph);
}

document.getElementById('kfTrack').addEventListener('click', (e) => {
  const rect = e.currentTarget.getBoundingClientRect();
  const frac = clamp((e.clientX - rect.left) / rect.width, 0, 1);
  playhead = frac * state.timing.total_ms;
  playing = false;
  document.getElementById('btnPlay').textContent = 'Play';
  renderFrame();
});

function renderKfList() {
  const list = document.getElementById('kfList');
  list.innerHTML = '';
  state.keyframes.forEach((kf, i) => {
    const row = document.createElement('div');
    row.className = 'kf-row' + (i === selectedKf ? ' selected' : '');

    const idx = document.createElement('span');
    idx.className = 'kf-index';
    idx.textContent = i + 1;

    const ms = document.createElement('span');
    ms.className = 'kf-ms';
    ms.textContent = kf.ms + ' ms';

    const summary = document.createElement('span');
    summary.className = 'kf-summary';
    summary.textContent = kfSummary(kf);

    const del = document.createElement('button');
    del.className = 'kf-del';
    del.textContent = '✕';
    del.title = 'Delete this keyframe';
    del.disabled = state.keyframes.length <= 2;
    del.addEventListener('click', (e) => {
      e.stopPropagation();
      if (state.keyframes.length <= 2) return;
      state.keyframes.splice(i, 1);
      selectedKf = clamp(selectedKf, 0, state.keyframes.length - 1);
      renderKfTrack();
      renderKfList();
      renderKfDetail();
      renderDebounced();
    });

    row.addEventListener('click', () => selectKf(i));
    row.appendChild(idx);
    row.appendChild(ms);
    row.appendChild(summary);
    row.appendChild(del);
    list.appendChild(row);
  });
}

function renderKfDetail() {
  const kf = state.keyframes[selectedKf];
  const el = document.getElementById('kfDetail');
  el.innerHTML = '';
  if (!kf) return;

  const addField = (label, value, onChange, disabled) => {
    const row = document.createElement('label');
    row.className = 'field';
    const span = document.createElement('span');
    span.textContent = label;
    const input = document.createElement('input');
    input.type = 'number';
    input.value = value;
    input.disabled = !!disabled;
    input.addEventListener('input', () => onChange(Number(input.value) || 0));
    row.appendChild(span);
    row.appendChild(input);
    el.appendChild(row);
  };

  addField('ms', kf.ms, (v) => {
    kf.ms = v;
    sortKeyframes();
    playhead = kf.ms;
    renderKfTrack();
    renderKfList();
    renderDebounced();
    renderFrame();
  });

  const sub1 = document.createElement('div');
  sub1.className = 'subhead';
  sub1.textContent = 'pos (panel px)';
  el.appendChild(sub1);
  const posRow = document.createElement('div');
  posRow.className = 'row3';
  ['x', 'y'].forEach((axis, i) => {
    const input = document.createElement('input');
    input.type = 'number';
    input.value = kf.pos[i];
    input.addEventListener('input', () => {
      kf.pos[i] = Number(input.value) || 0;
      renderKfList();
      renderDebounced();
    });
    posRow.appendChild(input);
  });
  el.appendChild(posRow);

  const sub2 = document.createElement('div');
  sub2.className = 'subhead';
  sub2.textContent = 'rot (x = camera pitch phase, 0..65536; y/z unused by this animation)';
  el.appendChild(sub2);
  const rotRow = document.createElement('div');
  rotRow.className = 'row3';
  ['x', 'y', 'z'].forEach((axis, i) => {
    const input = document.createElement('input');
    input.type = 'number';
    input.value = kf.rot[i];
    input.disabled = i > 0;
    input.addEventListener('input', () => {
      kf.rot[i] = Number(input.value) || 0;
      renderKfList();
      renderDebounced();
    });
    rotRow.appendChild(input);
  });
  el.appendChild(rotRow);

  const sub3 = document.createElement('div');
  sub3.className = 'subhead';
  sub3.textContent = 'scale (uniform - x/y/z locked together, 256 = 1.0)';
  el.appendChild(sub3);
  const scaleInput = document.createElement('input');
  scaleInput.type = 'number';
  scaleInput.value = kf.scale[0];
  scaleInput.addEventListener('input', () => {
    const v = Number(scaleInput.value) || 0;
    kf.scale[0] = kf.scale[1] = kf.scale[2] = v;
    renderKfList();
    renderDebounced();
  });
  el.appendChild(scaleInput);

  const sub4 = document.createElement('div');
  sub4.className = 'subhead';
  sub4.textContent = 'ease (of the segment arriving at this keyframe)';
  el.appendChild(sub4);
  const easeSelect = document.createElement('select');
  const isFirst = selectedKf === 0;
  easeSelect.disabled = isFirst;
  for (const opt of ['linear', 'ease_out', 'ease_in']) {
    const o = document.createElement('option');
    o.value = opt;
    o.textContent = opt;
    if (kf.ease === opt) o.selected = true;
    easeSelect.appendChild(o);
  }
  easeSelect.addEventListener('change', () => {
    kf.ease = easeSelect.value;
    renderKfList();
    renderDebounced();
  });
  el.appendChild(easeSelect);
}

document.getElementById('btnAddKf').addEventListener('click', () => {
  /* Seeded from the current selection rather than interpolated from the
   * server (which would need a round trip) - close enough to land near
   * the playhead's neighbourhood, and every field is right there in the
   * details panel to correct immediately after. */
  const base = state.keyframes[selectedKf] || state.keyframes[0];
  state.keyframes.push({
    ms: Math.round(clamp(playhead, 0, state.timing.total_ms)),
    pos: [...base.pos],
    rot: [...base.rot],
    scale: [...base.scale],
    ease: 'linear',
  });
  sortKeyframes();
  selectedKf = state.keyframes.findIndex((k) => k.ms === Math.round(playhead));
  renderKfTrack();
  renderKfList();
  renderKfDetail();
  renderDebounced();
});

/* ===========================================================================
 * Play controls
 * ======================================================================= */

scrub.addEventListener('input', () => {
  playing = false;
  document.getElementById('btnPlay').textContent = 'Play';
  playhead = Number(scrub.value);
  renderFrame();
});

const btnPlay = document.getElementById('btnPlay');
btnPlay.addEventListener('click', () => {
  playing = !playing;
  btnPlay.textContent = playing ? 'Pause' : 'Play';
  if (playing) {
    if (playhead >= state.timing.total_ms) playhead = 0;
    lastFrameTime = performance.now();
    requestAnimationFrame(tick);
  }
});

/* Capped well under real playback speed: each frame is a network round
 * trip to a freshly spawned native process, not a canvas repaint - see
 * boot_anim_editor_server.py's own top comment. ~12fps is plenty to judge
 * timing and motion by eye without flooding the server. */
const PLAYBACK_FPS = 12;

function tick(now) {
  if (!playing) return;
  const dt = now - lastFrameTime;
  if (dt >= 1000 / PLAYBACK_FPS) {
    lastFrameTime = now;
    playhead += dt;
    if (playhead >= state.timing.total_ms) {
      playhead = 0;
    }
    renderFrame();
  }
  requestAnimationFrame(tick);
}

/* ===========================================================================
 * Bake / Load
 * ======================================================================= */

document.getElementById('btnBake').addEventListener('click', () => {
  const payload = { timing: state.timing, keyframes: state.keyframes };
  const blob = new Blob([JSON.stringify(payload, null, 4)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'boot_anim_timeline.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
});

document.getElementById('btnLoad').addEventListener('click', () => {
  document.getElementById('fileInput').click();
});
document.getElementById('fileInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const loaded = JSON.parse(reader.result);
      if (!loaded.timing || !loaded.keyframes) throw new Error('missing timing/keyframes');
      state = loaded;
      selectedKf = 0;
      playhead = 0;
      renderConsts();
      renderKfTrack();
      renderKfList();
      renderKfDetail();
      renderFrame();
    } catch (err) {
      alert('Could not load that file as a boot_anim_timeline.json: ' + err.message);
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

/* ===========================================================================
 * Boot
 * ======================================================================= */

renderConsts();
renderKfTrack();
renderKfList();
renderKfDetail();
renderFrame();
</script>
</body>
</html>
